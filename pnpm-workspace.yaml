packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  protobufjs: true
  sharp: false
  unrs-resolver: true

# NativeWind v5 RC needs one lightningcss version across Tailwind, react-native-css and Expo's
# Metro CSS pipeline (deserialization errors otherwise). Scoped so apps/frontend keeps its own.
overrides:
  '@expo/metro-config>lightningcss': 1.30.1
  'react-native-css>lightningcss': 1.30.1

# Disable supply-chain release delay during local bootstrapping
minimumReleaseAge: 0
